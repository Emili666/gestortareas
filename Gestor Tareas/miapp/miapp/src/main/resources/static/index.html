<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #nuevaTarea {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        #nuevaTarea:focus {
            outline: none;
            border-color: #667eea;
        }

        #btnAgregar {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        #btnAgregar:hover {
            background: #5568d3;
        }

        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filtros button {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filtros button.active {
            background: #667eea;
            color: white;
        }

        #listaTareas {
            list-style: none;
        }

        .tarea {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .tarea:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .tarea.completada {
            opacity: 0.6;
        }

        .tarea.completada .texto {
            text-decoration: line-through;
            color: #6c757d;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .texto {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .btnEliminar {
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btnEliminar:hover {
            background: #c82333;
        }

        .contador {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Gestor de Tareas</h1>

    <div id="errorMsg" class="error" style="display: none;"></div>

    <div class="input-container">
        <input
                type="text"
                id="nuevaTarea"
                placeholder="¿Qué necesitas hacer?"
                onkeypress="if(event.key === 'Enter') agregarTarea()"
        >
        <button id="btnAgregar" onclick="agregarTarea()">Agregar</button>
    </div>

    <div class="filtros">
        <button class="active" onclick="filtrar('todas', event)">Todas</button>
        <button onclick="filtrar('pendientes', event)">Pendientes</button>
        <button onclick="filtrar('completadas', event)">Completadas</button>
    </div>

    <ul id="listaTareas">
        <li class="loading">Cargando tareas...</li>
    </ul>

    <div class="contador" id="contador"></div>
</div>

<script>
    const API_URL = 'http://localhost:8080/tareas';
    let tareas = [];
    let filtroActual = 'todas';

    // Cargar tareas al iniciar
    window.onload = () => {
        cargarTareas();
    };

    // Cargar tareas desde el backend
    async function cargarTareas() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Error al cargar tareas');

            const data = await response.json();

            // Generar IDs secuenciales basados en el orden
            tareas = data.map((tarea, index) => ({
                id: index + 1,
                titulo: tarea.titulo,
                completada: tarea.completada
            }));

            renderizarTareas();
            ocultarError();
        } catch (error) {
            console.error(error);
            mostrarError('No se pudo conectar con el servidor. ¿Está corriendo Spring Boot en el puerto 8080?');
        }
    }

    // Agregar nueva tarea
    async function agregarTarea() {
        const input = document.getElementById('nuevaTarea');
        const titulo = input.value.trim();

        if (titulo === '') {
            alert('Por favor escribe una tarea');
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    titulo: titulo,
                    completada: false
                })
            });

            if (!response.ok) throw new Error('Error al crear tarea');

            input.value = '';
            await cargarTareas();
            ocultarError();
        } catch (error) {
            console.error(error);
            mostrarError('No se pudo crear la tarea');
        }
    }

    // Cambiar estado de tarea (CORREGIDO)
    async function toggleTarea(id) {
        const tarea = tareas.find(t => t.id === id);
        if (!tarea) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    titulo: tarea.titulo,
                    completada: !tarea.completada  // Cambiar el estado
                })
            });

            if (!response.ok) throw new Error('Error al actualizar tarea');

            // Actualizar localmente
            tarea.completada = !tarea.completada;
            renderizarTareas();
            ocultarError();
        } catch (error) {
            console.error(error);
            mostrarError('No se pudo actualizar la tarea');
        }
    }

    // Eliminar tarea
    async function eliminarTarea(id) {
        if (!confirm('¿Seguro que quieres eliminar esta tarea?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('Error al eliminar tarea');

            await cargarTareas();
            ocultarError();
        } catch (error) {
            console.error(error);
            mostrarError('No se pudo eliminar la tarea');
        }
    }

    // Renderizar tareas
    function renderizarTareas() {
        const lista = document.getElementById('listaTareas');

        let tareasFiltradas = tareas;

        if (filtroActual === 'completadas') {
            tareasFiltradas = tareas.filter(t => t.completada);
        } else if (filtroActual === 'pendientes') {
            tareasFiltradas = tareas.filter(t => !t.completada);
        }

        if (tareasFiltradas.length === 0) {
            lista.innerHTML = '<li class="loading">No hay tareas para mostrar</li>';
            actualizarContador();
            return;
        }

        lista.innerHTML = tareasFiltradas.map(tarea => `
            <li class="tarea ${tarea.completada ? 'completada' : ''}">
                <input
                    type="checkbox"
                    class="checkbox"
                    ${tarea.completada ? 'checked' : ''}
                    onchange="toggleTarea(${tarea.id})"
                >
                <span class="texto">${tarea.titulo}</span>
                <button class="btnEliminar" onclick="eliminarTarea(${tarea.id})">
                    🗑️ Eliminar
                </button>
            </li>
        `).join('');

        actualizarContador();
    }

    // Filtrar tareas
    function filtrar(tipo, event) {
        filtroActual = tipo;

        // Actualizar botones activos
        document.querySelectorAll('.filtros button').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        renderizarTareas();
    }

    // Actualizar contador
    function actualizarContador() {
        const total = tareas.length;
        const completadas = tareas.filter(t => t.completada).length;
        const pendientes = total - completadas;

        document.getElementById('contador').textContent =
            `Total: ${total} | Completadas: ${completadas} | Pendientes: ${pendientes}`;
    }

    // Mostrar error
    function mostrarError(mensaje) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = mensaje;
        errorDiv.style.display = 'block';
    }

    // Ocultar error
    function ocultarError() {
        document.getElementById('errorMsg').style.display = 'none';
    }
</script>
</body>
</html>
